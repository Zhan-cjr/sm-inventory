name: sm-inventory-prod

services:
  # Redis Cache & Queue Worker
  redis:
    image: redis:7-alpine
    container_name: sm_redis
    restart: unless-stopped
    command: redis-server --requirepass "redissminventory@100626"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Meilisearch Engine
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: sm_meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: KunciRahasiaGudangSminventory123!
    volumes:
      - meili_data:/meili_data

  # Backend Service (Laravel PHP 8.3)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sm_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      MEILISEARCH_HOST: http://meilisearch:7700
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  # Laravel Reverb WebSocket Server
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sm_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8085
    ports:
      - "8085:8085"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  # Laravel Queue Worker
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sm_queue_worker
    restart: unless-stopped
    command: su -s /bin/bash www-data -c "php artisan queue:work --tries=3 --timeout=3600"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      MEILISEARCH_HOST: http://meilisearch:7700
    depends_on:
      redis:
        condition: service_started

  # AI Service (Python FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: sm_ai_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USERNAME:-sm_user}
      DB_PASSWORD: ${DB_PASSWORD:-sm_password}
      DB_NAME: ${DB_DATABASE:-sm_inventory}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}

  # Admin & POS Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sm_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Company Profile Landing Page (Next.js)
  company-profile:
    build:
      context: ./company-profile
      dockerfile: Dockerfile
    container_name: sm_company_profile
    restart: unless-stopped
    ports:
      - "3000:3000"

  # E-commerce Frontend Store (React + Vite)
  ecommerce-frontend:
    build:
      context: ./ecommerce-frontend
      dockerfile: Dockerfile.prod
    container_name: sm_ecommerce_frontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  redis_data:
  meili_data:
