<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan URL Admin - SM Inventory</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .settings-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      padding: 2.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #eff6ff;
      color: var(--primary);
      font-size: 28px;
      margin-bottom: 12px;
      border: 1px solid #dbeafe;
    }

    .header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      color: var(--text-main);
      transition: all 0.2s ease;
      font-family: monospace;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .hint {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.775rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .presets-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .preset-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 0.775rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .preset-btn:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
      color: var(--primary);
    }

    .test-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px dashed var(--border);
    }

    .test-btn {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.825rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .test-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .test-result {
      font-size: 0.8rem;
      font-weight: 500;
      max-width: 60%;
      text-align: right;
      word-break: break-word;
    }

    .test-result.success {
      color: var(--success);
    }

    .test-result.error {
      color: var(--danger);
    }

    .test-result.loading {
      color: var(--primary);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 1.5rem;
    }

    .btn-submit {
      flex: 2;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.875rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn-cancel {
      flex: 1;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border);
      padding: 0.875rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:hover {
      background: #e2e8f0;
    }

    .footer-note {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.775rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .footer-note kbd {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="settings-card">
    <div class="header">
      <div class="logo-badge">🖥️</div>
      <h2>Pengaturan Server Admin</h2>
      <p>Konfigurasi alamat URL backend Filament Admin</p>
    </div>

    <form id="settingsForm">
      <div class="form-group">
        <label for="adminUrl">Alamat URL Admin</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="adminUrl" 
            placeholder="https://admin.toserbaselamat.id" 
            required 
            autocomplete="off"
            spellcheck="false"
          >
        </div>
        <span class="hint">Masukkan domain server (misal: <code>https://admin.toserbaselamat.id</code>) atau IP server lokal.</span>
      </div>

      <div class="presets-label">Pilihan Cepat Server:</div>
      <div class="presets-grid">
        <button type="button" class="preset-btn" data-url="https://admin.toserbaselamat.id">
          🟢 Produksi
        </button>
        <button type="button" class="preset-btn" data-url="https://adminstg.toserbaselamat.id">
          🟡 Staging
        </button>
        <button type="button" class="preset-btn" data-url="http://192.168.88.14:8080/admin">
          💻 IP LAN
        </button>
      </div>

      <div class="test-wrapper">
        <button type="button" id="btnTest" class="test-btn">
          <span>⚡ Uji Koneksi</span>
        </button>
        <div id="testResult" class="test-result">Belum diuji</div>
      </div>

      <div class="actions">
        <button type="button" id="btnCancel" class="btn-cancel">Batal</button>
        <button type="submit" id="btnSave" class="btn-submit">💾 Simpan & Buka</button>
      </div>
    </form>

    <div class="footer-note">
      Tips: Tekan tombol <kbd>F2</kbd> pada keyboard kapan saja untuk membuka kembali halaman pengaturan ini.
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
